[project]
name = "vdrama-api"
version = "0.1.0"
description = "VDrama backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "limits>=5.8.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pytest-asyncio>=1.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Thư mục ./alembic trùng tên package alembic nên phải khai báo rõ.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
